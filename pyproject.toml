[project]
name = "ampire"
version = "0.1.0"
description = "Genome-centric exploration of antimicrobial peptide presence in bacterial genomes"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
  { name = "Silver Gojo", email = "SilverGojo4@gmail.com" }
]

dependencies = [
  "biopython>=1.76,<2",
  "pandas>=1.5,<3",
  "numpy>=1.21,<3",
  "pyyaml>=6.0",
  "tqdm>=4.60",
  "requests>=2.25",
  "ete3>=3.1",
  "rich>=13.0",
]

[project.optional-dependencies]
viz = [
  "matplotlib>=3.5",
  "seaborn>=0.11",
  "matplotlib-venn>=0.11",
  "logomaker>=0.8",
]

dev = [
  "pytest>=7.0",
  "black>=23.0",
  "isort>=5.0",
  "pylint>=3.0",
]

[project.scripts]
ampire = "app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
